<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a101a" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>
    <linearGradient id="glow" x1="400" y1="0" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162233" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6" />
  <circle cx="400" cy="180" r="220" fill="url(#radial)" />
  <rect width="800" height="450" fill="url(#glow)" />

  <!-- Orbit / Data Stream Emblem -->
  <g transform="translate(360, 90)">
    <circle cx="40" cy="50" r="42" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
    <circle cx="40" cy="50" r="26" stroke="#ff6600" stroke-width="2" opacity="0.9" />
    <circle cx="40" cy="50" r="10" fill="#38bdf8" />
    <circle cx="70" cy="30" r="5" fill="#ff6600" />
    <circle cx="15" cy="70" r="4" fill="#38bdf8" />
  </g>

  <!-- Titles -->
  <text x="400" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">NEO-ANALYTICS</text>
  <text x="400" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="15" fill="#38bdf8" letter-spacing="2">REAL-TIME DATA STREAMING PIPELINE</text>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#a3a3a3">NASA NeoWs • Apache Kafka • Spark • TimescaleDB • Grafana</text>

  <!-- Status tag -->
  <rect x="330" y="365" width="140" height="26" rx="13" fill="#141c28" stroke="#223348" />
  <circle cx="348" cy="378" r="4" fill="#38bdf8" />
  <text x="395" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#e7e7e7">DATA STREAMING</text>
</svg>
