<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141410" />
      <stop offset="100%" stop-color="#070705" />
    </linearGradient>
    <linearGradient id="glow" x1="400" y1="0" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25241b" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6" />
  <circle cx="400" cy="180" r="220" fill="url(#radial)" />
  <rect width="800" height="450" fill="url(#glow)" />

  <!-- Quiz / Assessment Portal Emblem -->
  <g transform="translate(360, 90)">
    <rect x="12" y="16" width="56" height="68" rx="8" fill="#201f16" stroke="#eab308" stroke-width="2" />
    <path d="M28 40 L36 48 L52 32" stroke="#ff6600" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="26" y1="60" x2="54" y2="60" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
    <circle cx="40" cy="16" r="6" fill="#eab308" />
  </g>

  <!-- Titles -->
  <text x="400" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">QUIZ PORTAL</text>
  <text x="400" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="15" fill="#eab308" letter-spacing="2">FULL-STACK ASSESSMENT SYSTEM</text>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#a3a3a3">React • Node.js • Express • MongoDB • Tailwind CSS</text>

  <!-- Status tag -->
  <rect x="330" y="365" width="140" height="26" rx="13" fill="#201e12" stroke="#3b371e" />
  <circle cx="348" cy="378" r="4" fill="#eab308" />
  <text x="395" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#e7e7e7">INTERACTIVE WEB</text>
</svg>
