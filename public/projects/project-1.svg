<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="glow" x1="400" y1="0" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6" />
  <circle cx="400" cy="180" r="220" fill="url(#radial)" />
  <rect width="800" height="450" fill="url(#glow)" />

  <!-- Cybersecurity Emblem Shield -->
  <g transform="translate(360, 90)">
    <path d="M40 0 L75 15 L75 55 Q75 90 40 105 Q5 90 5 55 L5 15 Z" fill="#181818" stroke="#ff6600" stroke-width="2.5" />
    <path d="M40 25 L40 85 M20 50 L60 50" stroke="#ff6600" stroke-width="2" stroke-linecap="round" />
    <circle cx="40" cy="50" r="10" fill="#ff6600" opacity="0.8" />
  </g>

  <!-- Titles -->
  <text x="400" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">RIFT</text>
  <text x="400" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="15" fill="#ff6600" letter-spacing="2">REMOTE INTRUSION FRAMEWORK TOOL</text>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#a3a3a3">Go • Celery • Redis • Django • MySQL</text>

  <!-- Status tag -->
  <rect x="330" y="365" width="140" height="26" rx="13" fill="#202020" stroke="#333" />
  <circle cx="348" cy="378" r="4" fill="#00ff66" />
  <text x="395" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#e7e7e7">CYBERSECURITY</text>
</svg>
