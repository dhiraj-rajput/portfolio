<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140f1a" />
      <stop offset="100%" stop-color="#07040a" />
    </linearGradient>
    <linearGradient id="glow" x1="400" y1="0" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#251a30" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6" />
  <circle cx="400" cy="180" r="220" fill="url(#radial)" />
  <rect width="800" height="450" fill="url(#glow)" />

  <!-- AI Brain / Node Network Emblem -->
  <g transform="translate(360, 90)">
    <path d="M25 40 Q40 10 55 40 Q75 55 55 70 Q40 95 25 70 Q5 55 25 40 Z" fill="#20152b" stroke="#a855f7" stroke-width="2" />
    <circle cx="40" cy="52" r="14" fill="#ff6600" opacity="0.9" />
    <line x1="15" y1="40" x2="65" y2="65" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="65" y1="40" x2="15" y2="65" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- Titles -->
  <text x="400" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="1">OMNISCIENT</text>
  <text x="400" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="15" fill="#c084fc" letter-spacing="2">AI-POWERED MANAGEMENT &amp; LLM</text>
  <text x="400" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#a3a3a3">Django • React • LLaMA • WebSockets • MongoDB</text>

  <!-- Status tag -->
  <rect x="330" y="365" width="140" height="26" rx="13" fill="#1d1428" stroke="#372250" />
  <circle cx="348" cy="378" r="4" fill="#a855f7" />
  <text x="395" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#e7e7e7">FULL STACK &amp; AI</text>
</svg>
